<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FEED PEOPLE FOUNDATION · School Points</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: #ffffff;
            background-image: 
                radial-gradient(circle at 10% 0%, rgba(26, 107, 58, 0.04) 0%, transparent 35%),
                radial-gradient(circle at 90% 100%, rgba(200, 150, 20, 0.05) 0%, transparent 35%);
            padding: 2rem 1.5rem;
            color: #1e2e1e;
            min-height: 100vh;
        }

        .foundation-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            background: #ffffff;
            padding: 0.8rem 1.8rem;
            border-radius: 60px;
            box-shadow: 0 6px 24px rgba(20, 80, 50, 0.08);
            border: 1px solid #e0ebe0;
            gap: 14px;
        }

        .foundation-title {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .foundation-logo {
            height: 70px;
            width: auto;
            max-width: 120px;
            object-fit: contain;
            border-radius: 8px;
            background: #f8fbf8;
            padding: 2px;
        }

        .foundation-title h1 {
            font-size: 1.6rem;
            letter-spacing: 1px;
            font-weight: 700;
            color: #0f4b28;
        }

        .badge {
            background: #f8f4e8;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            font-weight: 600;
            color: #a67c10;
            border: 1px solid #e8d9a8;
            font-size: 0.9rem;
        }

        /* ---- CONTROL BAR ---- */
        .control-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: center;
            background: #ffffff;
            padding: 1rem 1.5rem;
            border-radius: 40px;
            border: 1px solid #e0ebe0;
            box-shadow: 0 4px 18px rgba(20, 80, 50, 0.06);
            margin-bottom: 1.8rem;
        }

        .control-bar label {
            font-weight: 600;
            font-size: 0.9rem;
            color: #4a6b4a;
            white-space: nowrap;
        }

        .school-select, .level-select {
            flex: 1;
            min-width: 150px;
            padding: 10px 18px;
            border: 1px solid #c8dcc8;
            border-radius: 40px;
            font-size: 0.95rem;
            font-weight: 600;
            background: #f8fbf8;
            color: #1e2e1e;
            outline: none;
            cursor: pointer;
            transition: 0.2s;
        }

        .school-select:focus, .level-select:focus {
            border-color: #1a6b3a;
            box-shadow: 0 0 0 3px rgba(26, 107, 58, 0.15);
            background: #ffffff;
        }

        .search-input {
            flex: 2;
            min-width: 220px;
            padding: 10px 18px;
            border: 1px solid #c8dcc8;
            border-radius: 40px;
            font-size: 0.95rem;
            background: #f8fbf8;
            color: #1e2e1e;
            outline: none;
            transition: 0.2s;
        }

        .search-input::placeholder {
            color: #9ab09a;
        }

        .search-input:focus {
            border-color: #1a6b3a;
            box-shadow: 0 0 0 3px rgba(26, 107, 58, 0.15);
            background: #ffffff;
        }

        .clear-search {
            background: #f8f4e8;
            border: 1px solid #e8d9a8;
            color: #a67c10;
            border-radius: 30px;
            padding: 8px 14px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.15s;
        }

        .clear-search:hover {
            background: #f5edcf;
            border-color: #d4b84a;
        }

        .logo-upload-label {
            background: #f8f4e8;
            border: 1px solid #e8d9a8;
            color: #a67c10;
            border-radius: 30px;
            padding: 8px 14px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.15s;
            white-space: nowrap;
        }

        .logo-upload-label:hover {
            background: #f5edcf;
            border-color: #d4b84a;
        }

        #logoUploadInput {
            display: none;
        }

        .schools-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            margin-top: 1rem;
        }

        .school-card {
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 8px 28px rgba(20, 80, 50, 0.07);
            border: 1px solid #e0ebe0;
            overflow: hidden;
            transition: 0.25s ease;
            display: flex;
            flex-direction: column;
        }

        .school-card:hover {
            box-shadow: 0 12px 36px rgba(20, 80, 50, 0.12);
            border-color: #c0dcc0;
        }

        .school-header {
            padding: 1.4rem 1.5rem 0.8rem 1.5rem;
            border-bottom: 2px dashed #d8e8d8;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .school-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: #0f4b28;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .school-name i {
            font-style: normal;
            font-size: 1.7rem;
        }

        .school-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 30px;
            transition: 0.1s;
            color: #a67c10;
            line-height: 1;
        }

        .icon-btn:hover {
            background: #f8f4e8;
        }

        .paste-area {
            padding: 1rem 1.5rem 0.5rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .paste-area textarea {
            width: 100%;
            border: 1px solid #c8dcc8;
            border-radius: 20px;
            padding: 12px 16px;
            font-size: 0.9rem;
            resize: vertical;
            min-height: 70px;
            background: #f8fbf8;
            color: #1e2e1e;
            outline: none;
            transition: 0.2s;
        }

        .paste-area textarea::placeholder {
            color: #9ab09a;
        }

        .paste-area textarea:focus {
            border-color: #1a6b3a;
            box-shadow: 0 0 0 3px rgba(26, 107, 58, 0.12);
            background: #ffffff;
        }

        .class-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .class-row select {
            flex: 2;
            min-width: 140px;
            border: 1px solid #c8dcc8;
            border-radius: 40px;
            padding: 10px 16px;
            font-size: 0.9rem;
            background: #f8fbf8;
            color: #1e2e1e;
            outline: none;
            cursor: pointer;
            font-weight: 500;
        }

        .class-row select:focus {
            border-color: #1a6b3a;
            box-shadow: 0 0 0 3px rgba(26, 107, 58, 0.12);
        }

        .btn {
            background: #1a6b3a;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 3px 10px rgba(26, 107, 58, 0.25);
            white-space: nowrap;
        }

        .btn:hover {
            background: #0f4b28;
            transform: scale(0.97);
            box-shadow: 0 5px 15px rgba(26, 107, 58, 0.35);
        }

        .btn-small {
            padding: 8px 14px;
            font-size: 0.8rem;
        }

        /* --- CLASS COLUMNS --- */
        .class-columns-container {
            display: flex;
            flex-direction: row;
            gap: 12px;
            padding: 0.8rem 1.5rem 1.5rem 1.5rem;
            overflow-x: auto;
            align-items: flex-start;
        }

        .class-column {
            flex: 1;
            min-width: 150px;
            background: #f8fbf8;
            border-radius: 20px;
            border: 1px solid #d8e8d8;
            padding: 12px 10px 10px 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .class-column-header {
            font-weight: 700;
            font-size: 1.1rem;
            color: #a67c10;
            text-align: center;
            padding-bottom: 6px;
            border-bottom: 2px solid #e8d9a8;
            letter-spacing: 1px;
        }

        .student-list-column {
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 60px;
            max-height: 420px;
            overflow-y: auto;
            padding-right: 2px;
        }

        .student-card-item {
            background: #ffffff;
            border-radius: 16px;
            padding: 10px 10px 8px 10px;
            border: 1px solid #d8e8d8;
            box-shadow: 0 2px 6px rgba(20, 80, 50, 0.04);
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: 0.2s;
        }

        .student-card-item:hover {
            border-color: #b8d4b8;
            box-shadow: 0 4px 12px rgba(20, 80, 50, 0.1);
        }

        .student-name-line {
            font-weight: 600;
            font-size: 0.88rem;
            color: #1e2e1e;
            word-break: break-word;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .student-name-line .student-name-text {
            flex: 1;
            padding: 2px 4px;
            border-radius: 8px;
            transition: 0.15s;
        }

        .student-name-line .student-name-text:hover {
            background: #f8f4e8;
            color: #a67c10;
        }

        .student-name-line .remove-student {
            font-size: 0.9rem;
            opacity: 0.6;
            background: transparent;
            border: none;
            color: #d9534f;
            cursor: pointer;
            padding: 0 4px;
            border-radius: 20px;
            transition: 0.15s;
        }

        .student-name-line .remove-student:hover {
            opacity: 1;
            background: #fdecea;
        }

        /* --- 50 boxes grid --- */
        .points-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 3px;
            margin-top: 4px;
        }

        .point-box {
            background: #f0f5f0;
            border: 1px solid #c8dcc8;
            border-radius: 6px;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6rem;
            font-weight: 600;
            color: #4a6b4a;
            cursor: pointer;
            transition: 0.15s;
            user-select: none;
            padding: 0;
            line-height: 1;
        }

        .point-box:hover {
            background: #e0efe0;
            border-color: #a8c8a8;
            transform: scale(1.08);
        }

        .point-box:active {
            transform: scale(0.92);
        }

        .point-box.filled {
            background: #1a6b3a;
            border-color: #0f4b28;
            color: #ffffff;
            font-weight: 700;
            box-shadow: 0 0 6px rgba(26, 107, 58, 0.4);
        }

        .total-badge {
            font-size: 0.7rem;
            background: #f8f4e8;
            padding: 3px 6px;
            border-radius: 30px;
            text-align: center;
            font-weight: 600;
            color: #a67c10;
            margin-top: 2px;
            border: 1px solid #e8d9a8;
            letter-spacing: 0.5px;
        }

        .cert-btn {
            background: #f8f4e8;
            border: 1px solid #e8d9a8;
            border-radius: 30px;
            padding: 6px 10px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #a67c10;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            width: 100%;
            letter-spacing: 0.3px;
        }

        .cert-btn:hover {
            background: #f5edcf;
            border-color: #d4b84a;
        }

        .cert-btn:active {
            transform: scale(0.97);
        }

        .empty-message {
            text-align: center;
            color: #9ab09a;
            font-style: italic;
            padding: 0.8rem 0;
            font-size: 0.8rem;
        }

        .footer-note {
            margin-top: 3rem;
            text-align: center;
            font-size: 0.85rem;
            color: #7a9a7a;
            border-top: 1px solid #e0ebe0;
            padding-top: 1.5rem;
            letter-spacing: 0.3px;
        }

        .no-results {
            text-align: center;
            padding: 3rem 1rem;
            color: #4a6b4a;
            font-size: 1.1rem;
            font-style: italic;
            background: #ffffff;
            border-radius: 32px;
            border: 1px dashed #c8dcc8;
        }

        .student-card-item.match-highlight {
            border: 2px solid #d4b84a;
            box-shadow: 0 0 0 3px rgba(212, 184, 74, 0.2);
        }

        /* ---- FULLSCREEN OVERLAY ---- */
        .fullscreen-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #ffffff;
            background-image: 
                radial-gradient(circle at 10% 0%, rgba(26, 107, 58, 0.04) 0%, transparent 35%),
                radial-gradient(circle at 90% 100%, rgba(200, 150, 20, 0.05) 0%, transparent 35%);
            z-index: 9999;
            overflow-y: auto;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
        }

        .fullscreen-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            background: #ffffff;
            padding: 1rem 2rem;
            border-radius: 60px;
            border: 1px solid #e0ebe0;
            box-shadow: 0 4px 18px rgba(20, 80, 50, 0.06);
            gap: 14px;
        }

        .fullscreen-header h2 {
            color: #0f4b28;
            font-size: 1.6rem;
            letter-spacing: 1px;
        }

        .close-fullscreen {
            background: #1a6b3a;
            border: none;
            color: #ffffff;
            border-radius: 30px;
            padding: 10px 20px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .close-fullscreen:hover {
            background: #0f4b28;
        }

        .fullscreen-points-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 12px;
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
        }

        .fullscreen-point-box {
            background: #f0f5f0;
            border: 2px solid #c8dcc8;
            border-radius: 14px;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: 700;
            color: #4a6b4a;
            cursor: pointer;
            transition: 0.15s;
            user-select: none;
        }

        .fullscreen-point-box:hover {
            background: #e0efe0;
            border-color: #a8c8a8;
            transform: scale(1.05);
        }

        .fullscreen-point-box:active {
            transform: scale(0.95);
        }

        .fullscreen-point-box.filled {
            background: #1a6b3a;
            border-color: #0f4b28;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(26, 107, 58, 0.4);
        }

        .fullscreen-total {
            text-align: center;
            font-size: 1.5rem;
            color: #a67c10;
            font-weight: 700;
            margin-top: 1.5rem;
            letter-spacing: 1px;
        }

        /* Custom scrollbar */
        .student-list-column::-webkit-scrollbar,
        .class-columns-container::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .student-list-column::-webkit-scrollbar-track,
        .class-columns-container::-webkit-scrollbar-track {
            background: #f0f5f0;
            border-radius: 10px;
        }

        .student-list-column::-webkit-scrollbar-thumb,
        .class-columns-container::-webkit-scrollbar-thumb {
            background: #c8dcc8;
            border-radius: 10px;
        }

        .student-list-column::-webkit-scrollbar-thumb:hover,
        .class-columns-container::-webkit-scrollbar-thumb:hover {
            background: #a8c8a8;
        }

        @media (max-width: 700px) {
            .foundation-logo {
                height: 50px;
            }
            .foundation-title h1 {
                font-size: 1rem;
            }
            .foundation-header {
                padding: 0.8rem 1rem;
            }
            .control-bar {
                padding: 0.8rem 1rem;
            }
            .fullscreen-points-grid {
                grid-template-columns: repeat(5, 1fr);
                gap: 8px;
            }
            .fullscreen-point-box {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="foundation-header">
        <div class="foundation-title">
            <img id="headerLogo" src="" alt="LOGO" class="foundation-logo" style="display:none;">
            <h1>FEED PEOPLE FOUNDATION</h1>
        </div>
        <div class="badge">📋 Points & students</div>
    </div>

    <!-- Control bar -->
    <div class="control-bar">
        <label for="schoolSelector">🏫 School:</label>
        <select id="schoolSelector" class="school-select">
            <option value="all">All schools</option>
        </select>

        <label for="levelSelector">📚 Level:</label>
        <select id="levelSelector" class="level-select">
            <option value="A1">A1</option>
            <option value="A2">A2</option>
            <option value="B1">B1</option>
            <option value="B2">B2</option>
            <option value="C1">C1</option>
            <option value="C2">C2</option>
        </select>

        <label for="searchInput">🔍 Search:</label>
        <input type="text" id="searchInput" class="search-input" placeholder="Type a student name..." autocomplete="off">
        <button class="clear-search" id="clearSearchBtn">Clear</button>

        <label for="logoUploadInput" class="logo-upload-label">🖼️ Upload Logo</label>
        <input type="file" id="logoUploadInput" accept="image/*">
    </div>

    <div class="schools-grid" id="schoolsGrid"></div>

    <div class="footer-note">
        ⚡ Paste names (one per line) — add class — click boxes to give +2 points each. Click a student name to enlarge. Right-click a box to remove 2 points.
    </div>

    <script>
        (function() {
            const SCHOOLS = [
                { id: 'csc', name: 'COLLÈGE SAINT-CROIX', icon: '✝️' },
                { id: 'csa', name: 'COLLÈGE SAINTE AGNÈS', icon: '🕊️' },
                { id: 'eureka', name: 'INSTITUT EUREKA', icon: '🔬' },
                { id: 'bethanie', name: 'INSTITUTION CHRÉTIENNE BÉTHANIE DU LIMBÉ', icon: '⛪' }
            ];

            const CLASSES = ['7e', '8e', '9e', 'Ns1', 'Ns2'];

            const store = {
                csc: [],
                csa: [],
                eureka: [],
                bethanie: []
            };

            let selectedSchoolId = 'all';
            let searchQuery = '';
            let selectedLevel = 'A1';
            let savedLogoDataUrl = '';

            function loadSavedLogo() {
                try {
                    const saved = localStorage.getItem('fpf_logo');
                    if (saved) {
                        savedLogoDataUrl = saved;
                        applyLogo();
                    }
                } catch(e) {}
            }

            function saveLogo(dataUrl) {
                savedLogoDataUrl = dataUrl;
                try {
                    localStorage.setItem('fpf_logo', dataUrl);
                } catch(e) {}
                applyLogo();
            }

            function applyLogo() {
                const headerLogo = document.getElementById('headerLogo');
                if (savedLogoDataUrl) {
                    headerLogo.src = savedLogoDataUrl;
                    headerLogo.style.display = 'block';
                } else {
                    headerLogo.style.display = 'none';
                }
            }

            document.getElementById('logoUploadInput').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => saveLogo(ev.target.result);
                reader.readAsDataURL(file);
            });

            function populateSchoolSelector() {
                const sel = document.getElementById('schoolSelector');
                sel.innerHTML = '<option value="all">All schools</option>';
                SCHOOLS.forEach(school => {
                    const opt = document.createElement('option');
                    opt.value = school.id;
                    opt.textContent = school.name;
                    sel.appendChild(opt);
                });
                sel.value = selectedSchoolId;
            }

            function uid() {
                return Date.now() + Math.random().toString(36).substring(2, 9);
            }

            function matchesSearch(student) {
                if (!searchQuery) return true;
                return student.name.toLowerCase().includes(searchQuery.toLowerCase());
            }

            function openFullscreen(student, schoolId) {
                const existing = document.querySelector('.fullscreen-overlay');
                if (existing) existing.remove();

                const overlay = document.createElement('div');
                overlay.className = 'fullscreen-overlay';

                const header = document.createElement('div');
                header.className = 'fullscreen-header';
                header.innerHTML = `
                    <h2>👤 ${escapeHtml(student.name)} — ${escapeHtml(student.class || '')}</h2>
                    <button class="close-fullscreen">✕ Close</button>
                `;
                header.querySelector('.close-fullscreen').addEventListener('click', () => overlay.remove());
                overlay.appendChild(header);

                const gridWrap = document.createElement('div');
                gridWrap.style.maxWidth = '1100px';
                gridWrap.style.margin = '0 auto';
                gridWrap.style.width = '100%';

                const grid = document.createElement('div');
                grid.className = 'fullscreen-points-grid';

                const totalDiv = document.createElement('div');
                totalDiv.className = 'fullscreen-total';

                function renderFullGrid() {
                    grid.innerHTML = '';
                    const score = student.score || 0;
                    const filled = Math.min(50, Math.floor(score / 2));
                    for (let i = 0; i < 50; i++) {
                        const box = document.createElement('div');
                        box.className = 'fullscreen-point-box' + (i < filled ? ' filled' : '');
                        box.textContent = i + 1;
                        box.addEventListener('click', (e) => {
                            e.stopPropagation();
                            if (student.score >= 100) return;
                            student.score = (student.score || 0) + 2;
                            renderFullGrid();
                            render();
                        });
                        box.addEventListener('contextmenu', (e) => {
                            e.preventDefault();
                            e.stopPropagation();
                            if (student.score >= 2) student.score -= 2;
                            else student.score = 0;
                            renderFullGrid();
                            render();
                        });
                        grid.appendChild(box);
                    }
                    totalDiv.textContent = `★ Total: ${student.score || 0} pts`;
                }

                gridWrap.appendChild(grid);
                gridWrap.appendChild(totalDiv);
                overlay.appendChild(gridWrap);

                document.body.appendChild(overlay);
                renderFullGrid();
            }

            function render() {
                const grid = document.getElementById('schoolsGrid');
                grid.innerHTML = '';

                const schoolsToRender = selectedSchoolId === 'all'
                    ? SCHOOLS
                    : SCHOOLS.filter(s => s.id === selectedSchoolId);

                let anyStudentRendered = false;

                schoolsToRender.forEach(school => {
                    const students = store[school.id] || [];
                    const filteredStudents = students.filter(matchesSearch);

                    if (selectedSchoolId === 'all' && searchQuery && filteredStudents.length === 0) {
                        return;
                    }

                    if (filteredStudents.length > 0) anyStudentRendered = true;

                    const card = document.createElement('div');
                    card.className = 'school-card';

                    const header = document.createElement('div');
                    header.className = 'school-header';
                    header.innerHTML = `
                        <div class="school-name">
                            <i>${school.icon}</i> ${school.name}
                        </div>
                        <div class="school-actions">
                            <button class="icon-btn" title="Clear all students" data-action="clear-school" data-school="${school.id}">🗑️</button>
                        </div>
                    `;
                    card.appendChild(header);

                    const pasteArea = document.createElement('div');
                    pasteArea.className = 'paste-area';

                    const textarea = document.createElement('textarea');
                    textarea.placeholder = 'Paste student names (one per line)...';
                    textarea.id = `paste-${school.id}`;
                    pasteArea.appendChild(textarea);

                    const classRow = document.createElement('div');
                    classRow.className = 'class-row';

                    const classSelect = document.createElement('select');
                    classSelect.id = `class-${school.id}`;
                    CLASSES.forEach(cls => {
                        const opt = document.createElement('option');
                        opt.value = cls;
                        opt.textContent = cls;
                        classSelect.appendChild(opt);
                    });
                    classRow.appendChild(classSelect);

                    const addBtn = document.createElement('button');
                    addBtn.className = 'btn btn-small';
                    addBtn.innerHTML = '➕ Add';
                    addBtn.dataset.action = 'add-students';
                    addBtn.dataset.school = school.id;
                    classRow.appendChild(addBtn);

                    pasteArea.appendChild(classRow);
                    card.appendChild(pasteArea);

                    const columnsContainer = document.createElement('div');
                    columnsContainer.className = 'class-columns-container';

                    CLASSES.forEach(cls => {
                        const colDiv = document.createElement('div');
                        colDiv.className = 'class-column';

                        const colHeader = document.createElement('div');
                        colHeader.className = 'class-column-header';
                        colHeader.textContent = cls;
                        colDiv.appendChild(colHeader);

                        const listDiv = document.createElement('div');
                        listDiv.className = 'student-list-column';

                        const classStudents = filteredStudents.filter(s => s.class === cls);
                        if (classStudents.length === 0) {
                            listDiv.innerHTML = `<div class="empty-message">—</div>`;
                        } else {
                            classStudents.forEach(student => {
                                const cardItem = createStudentCard(student, school.id);
                                listDiv.appendChild(cardItem);
                            });
                        }

                        colDiv.appendChild(listDiv);
                        columnsContainer.appendChild(colDiv);
                    });

                    card.appendChild(columnsContainer);
                    grid.appendChild(card);
                });

                if (!anyStudentRendered && searchQuery) {
                    const noRes = document.createElement('div');
                    noRes.className = 'no-results';
                    noRes.innerHTML = `🔍 No students found matching "<strong>${escapeHtml(searchQuery)}</strong>".`;
                    grid.appendChild(noRes);
                }
            }

            function createStudentCard(student, schoolId) {
                const card = document.createElement('div');
                card.className = 'student-card-item';

                if (searchQuery && student.name.toLowerCase().includes(searchQuery.toLowerCase())) {
                    card.classList.add('match-highlight');
                }

                const nameLine = document.createElement('div');
                nameLine.className = 'student-name-line';

                const nameSpan = document.createElement('span');
                nameSpan.className = 'student-name-text';
                nameSpan.textContent = student.name;
                nameSpan.title = 'Click to enlarge';
                nameSpan.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openFullscreen(student, schoolId);
                });
                nameLine.appendChild(nameSpan);

                const removeBtn = document.createElement('button');
                removeBtn.className = 'remove-student';
                removeBtn.innerHTML = '✕';
                removeBtn.title = 'Remove student';
                removeBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const schoolStudents = store[schoolId];
                    const idx = schoolStudents.findIndex(s => s.id === student.id);
                    if (idx !== -1) {
                        schoolStudents.splice(idx, 1);
                        render();
                    }
                });
                nameLine.appendChild(removeBtn);
                card.appendChild(nameLine);

                if (student.score === undefined) student.score = 0;
                const score = student.score || 0;
                const filledBoxes = Math.min(50, Math.floor(score / 2));

                const gridDiv = document.createElement('div');
                gridDiv.className = 'points-grid';

                for (let i = 0; i < 50; i++) {
                    const box = document.createElement('div');
                    box.className = 'point-box' + (i < filledBoxes ? ' filled' : '');
                    box.textContent = i + 1;
                    box.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (student.score >= 100) return;
                        student.score = (student.score || 0) + 2;
                        render();
                    });
                    box.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        if (student.score >= 2) student.score -= 2;
                        else student.score = 0;
                        render();
                    });
                    gridDiv.appendChild(box);
                }
                card.appendChild(gridDiv);

                const totalBadge = document.createElement('div');
                totalBadge.className = 'total-badge';
                totalBadge.textContent = `★ ${score} pts`;
                card.appendChild(totalBadge);

                const certBtn = document.createElement('button');
                certBtn.className = 'cert-btn';
                certBtn.innerHTML = '📜 ' + selectedLevel + ' Certificate';
                certBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    generateCertificate(student);
                });
                card.appendChild(certBtn);

                return card;
            }

            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function addStudentsFromPaste(schoolId) {
                const textarea = document.getElementById(`paste-${schoolId}`);
                const classSelect = document.getElementById(`class-${schoolId}`);
                if (!textarea || !classSelect) return;

                const rawText = textarea.value.trim();
                if (!rawText) {
                    alert('Please paste at least one student name.');
                    return;
                }
                const className = classSelect.value;
                const lines = rawText.split(/\n/).map(l => l.trim()).filter(l => l.length > 0);
                const schoolStudents = store[schoolId];
                lines.forEach(name => {
                    schoolStudents.push({ id: uid(), name, class: className, score: 0 });
                });
                textarea.value = '';
                render();
            }

            function clearSchool(schoolId) {
                if (confirm('Remove ALL students from this school? This cannot be undone.')) {
                    store[schoolId] = [];
                    render();
                }
            }

            document.getElementById('schoolsGrid').addEventListener('click', (e) => {
                const target = e.target.closest('button');
                if (!target) return;
                const action = target.dataset.action;
                const schoolId = target.dataset.school;
                if (action === 'add-students' && schoolId) addStudentsFromPaste(schoolId);
                if (action === 'clear-school' && schoolId) clearSchool(schoolId);
            });

            document.getElementById('schoolSelector').addEventListener('change', (e) => {
                selectedSchoolId = e.target.value;
                render();
            });

            document.getElementById('levelSelector').addEventListener('change', (e) => {
                selectedLevel = e.target.value;
                render();
            });

            document.getElementById('searchInput').addEventListener('input', (e) => {
                searchQuery = e.target.value.trim();
                render();
            });

            document.getElementById('clearSearchBtn').addEventListener('click', () => {
                document.getElementById('searchInput').value = '';
                searchQuery = '';
                render();
            });

            populateSchoolSelector();
            loadSavedLogo();
            render();

        })();
