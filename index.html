<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FEED PEOPLE FOUNDATION · School Points</title>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: #ffffff;
            background-image: 
                radial-gradient(circle at 10% 0%, rgba(26, 107, 58, 0.04) 0%, transparent 35%),
                radial-gradient(circle at 90% 100%, rgba(200, 150, 20, 0.05) 0%, transparent 35%);
            padding: 2rem 1.5rem;
            color: #1e2e1e;
            min-height: 100vh;
        }

        .foundation-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            background: #ffffff;
            padding: 0.8rem 1.8rem;
            border-radius: 60px;
            box-shadow: 0 6px 24px rgba(20, 80, 50, 0.08);
            border: 1px solid #e0ebe0;
            gap: 14px;
        }

        .foundation-title {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .foundation-logo {
            height: 70px;
            width: auto;
            max-width: 120px;
            object-fit: contain;
            border-radius: 8px;
            background: #f8fbf8;
            padding: 2px;
        }

        .foundation-title h1 {
            font-size: 1.6rem;
            letter-spacing: 1px;
            font-weight: 700;
            color: #0f4b28;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .save-status {
            background: #e8f5e8;
            color: #1a6b3a;
            padding: 0.4rem 0.9rem;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid #c8e6c8;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.3s;
        }

        .save-status.saving {
            background: #fef3e0;
            color: #a67c10;
            border-color: #f0d9a8;
        }

        .save-status.error {
            background: #fdecea;
            color: #c0392b;
            border-color: #f5b7b1;
        }

        .save-status.cloud {
            background: linear-gradient(135deg, #e8f5e8, #d4ecd4);
            border-color: #a8d0a8;
        }

        .badge {
            background: #f8f4e8;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            font-weight: 600;
            color: #a67c10;
            border: 1px solid #e8d9a8;
            font-size: 0.9rem;
        }

        /* ========== CLOUD STATUS ========== */
        .cloud-banner {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            background: linear-gradient(135deg, #e8f5e8, #d4ecd4);
            padding: 0.8rem 1.2rem;
            border-radius: 40px;
            border: 1px solid #a8d0a8;
            margin-bottom: 1.2rem;
            box-shadow: 0 3px 12px rgba(20, 80, 50, 0.08);
        }

        .cloud-banner.disconnected {
            background: linear-gradient(135deg, #fdecea, #fadbd8);
            border-color: #f5b7b1;
        }

        .cloud-banner.local {
            background: linear-gradient(135deg, #fef3e0, #fdebd0);
            border-color: #f0d9a8;
        }

        .cloud-icon {
            font-size: 1.4rem;
        }

        .cloud-text {
            font-size: 0.85rem;
            font-weight: 600;
            color: #0f4b28;
            flex: 1;
            min-width: 200px;
        }

        .cloud-banner.disconnected .cloud-text { color: #922b21; }
        .cloud-banner.local .cloud-text { color: #7d6608; }

        .cloud-btn {
            background: #ffffff;
            border: 1px solid #a8d0a8;
            color: #1a6b3a;
            border-radius: 30px;
            padding: 6px 12px;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.15s;
        }

        .cloud-btn:hover { background: #f0f8f0; }

        .analytics-section {
            background: #ffffff;
            border-radius: 32px;
            border: 1px solid #e0ebe0;
            box-shadow: 0 6px 24px rgba(20, 80, 50, 0.06);
            padding: 1.8rem 2rem;
            margin-bottom: 1.8rem;
        }

        .analytics-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: 700;
            color: #0f4b28;
            margin-bottom: 1.2rem;
            padding-bottom: 0.8rem;
            border-bottom: 2px solid #f0f5f0;
        }

        .analytics-title .icon { font-size: 1.5rem; }

        .total-students-banner {
            background: linear-gradient(135deg, #1a6b3a, #0f4b28);
            border-radius: 24px;
            padding: 24px 30px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            box-shadow: 0 8px 24px rgba(26, 107, 58, 0.25);
            position: relative;
            overflow: hidden;
        }

        .total-students-banner::before {
            content: '';
            position: absolute;
            top: -50%; right: -10%;
            width: 250px; height: 250px;
            background: radial-gradient(circle, rgba(240, 192, 64, 0.2) 0%, transparent 70%);
            border-radius: 50%;
        }

        .total-students-left {
            display: flex;
            align-items: center;
            gap: 18px;
            position: relative;
            z-index: 1;
        }

        .total-students-icon {
            font-size: 2.8rem;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.2));
        }

        .total-students-text { display: flex; flex-direction: column; }

        .total-students-label {
            font-size: 0.8rem;
            color: #a8d0b0;
            letter-spacing: 2px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .total-students-value {
            font-size: 3rem;
            font-weight: 800;
            color: #ffffff;
            line-height: 1;
            letter-spacing: -1px;
            text-shadow: 0 2px 12px rgba(0,0,0,0.2);
        }

        .total-students-sub {
            font-size: 0.85rem;
            color: #c8e6c8;
            margin-top: 4px;
            font-style: italic;
        }

        .total-students-breakdown {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
        }

        .breakdown-item {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 16px;
            padding: 12px 18px;
            text-align: center;
            min-width: 90px;
        }

        .breakdown-item .bd-value {
            font-size: 1.6rem;
            font-weight: 700;
            color: #f0c040;
            line-height: 1;
        }

        .breakdown-item .bd-label {
            font-size: 0.7rem;
            color: #d8ecd8;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 4px;
            font-weight: 600;
        }

        .stats-overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            background: linear-gradient(135deg, #f8fbf8, #f0f5f0);
            border: 1px solid #d8e8d8;
            border-radius: 20px;
            padding: 16px 18px;
            text-align: center;
            transition: 0.2s;
        }

        .stat-card:hover {
            border-color: #a8c8a8;
            box-shadow: 0 4px 12px rgba(20, 80, 50, 0.08);
        }

        .stat-value {
            font-size: 2.2rem;
            font-weight: 700;
            color: #1a6b3a;
            line-height: 1.1;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 0.8rem;
            color: #4a6b4a;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .top-students-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #a67c10;
            margin-bottom: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .school-analytics {
            background: #f8fbf8;
            border: 1px solid #e0ebe0;
            border-radius: 20px;
            padding: 16px 18px;
            margin-bottom: 14px;
        }

        .school-analytics-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e0ebe0;
        }

        .school-analytics-name {
            font-weight: 700;
            color: #0f4b28;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .school-analytics-count {
            background: #1a6b3a;
            color: #ffffff;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 30px;
            letter-spacing: 0.5px;
        }

        .class-top-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 10px;
        }

        .class-top-card {
            background: #ffffff;
            border: 1px solid #d8e8d8;
            border-radius: 14px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .class-top-label {
            font-size: 0.7rem;
            font-weight: 700;
            color: #a67c10;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .class-top-name {
            font-size: 0.88rem;
            font-weight: 600;
            color: #1e2e1e;
            word-break: break-word;
            line-height: 1.2;
        }

        .class-top-points {
            font-size: 0.75rem;
            font-weight: 700;
            color: #1a6b3a;
        }

        .class-top-empty {
            font-size: 0.8rem;
            color: #9ab09a;
            font-style: italic;
        }

        .no-data-analytics {
            text-align: center;
            padding: 1.5rem;
            color: #9ab09a;
            font-style: italic;
            font-size: 0.9rem;
        }

        .control-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: center;
            background: #ffffff;
            padding: 1rem 1.5rem;
            border-radius: 40px;
            border: 1px solid #e0ebe0;
            box-shadow: 0 4px 18px rgba(20, 80, 50, 0.06);
            margin-bottom: 1.8rem;
        }

        .control-bar label {
            font-weight: 600;
            font-size: 0.9rem;
            color: #4a6b4a;
            white-space: nowrap;
        }

        .school-select, .level-select {
            flex: 1;
            min-width: 150px;
            padding: 10px 18px;
            border: 1px solid #c8dcc8;
            border-radius: 40px;
            font-size: 0.95rem;
            font-weight: 600;
            background: #f8fbf8;
            color: #1e2e1e;
            outline: none;
            cursor: pointer;
            transition: 0.2s;
        }

        .school-select:focus, .level-select:focus {
            border-color: #1a6b3a;
            box-shadow: 0 0 0 3px rgba(26, 107, 58, 0.15);
            background: #ffffff;
        }

        .search-input {
            flex: 2;
            min-width: 220px;
            padding: 10px 18px;
            border: 1px solid #c8dcc8;
            border-radius: 40px;
            font-size: 0.95rem;
            background: #f8fbf8;
            color: #1e2e1e;
            outline: none;
            transition: 0.2s;
        }

        .search-input::placeholder { color: #9ab09a; }

        .search-input:focus {
            border-color: #1a6b3a;
            box-shadow: 0 0 0 3px rgba(26, 107, 58, 0.15);
            background: #ffffff;
        }

        .clear-search {
            background: #f8f4e8;
            border: 1px solid #e8d9a8;
            color: #a67c10;
            border-radius: 30px;
            padding: 8px 14px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.15s;
        }

        .clear-search:hover { background: #f5edcf; border-color: #d4b84a; }

        .logo-upload-label {
            background: #f8f4e8;
            border: 1px solid #e8d9a8;
            color: #a67c10;
            border-radius: 30px;
            padding: 8px 14px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.15s;
            white-space: nowrap;
        }

        .logo-upload-label:hover { background: #f5edcf; border-color: #d4b84a; }

        #logoUploadInput { display: none; }

        .schools-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            margin-top: 1rem;
        }

        .school-card {
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 8px 28px rgba(20, 80, 50, 0.07);
            border: 1px solid #e0ebe0;
            overflow: hidden;
            transition: 0.25s ease;
            display: flex;
            flex-direction: column;
        }

        .school-card:hover {
            box-shadow: 0 12px 36px rgba(20, 80, 50, 0.12);
            border-color: #c0dcc0;
        }

        .school-header {
            padding: 1.4rem 1.5rem 0.8rem 1.5rem;
            border-bottom: 2px dashed #d8e8d8;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .school-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: #0f4b28;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .school-name i { font-style: normal; font-size: 1.7rem; }

        .school-actions { display: flex; gap: 8px; }

        .icon-btn {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 30px;
            transition: 0.1s;
            color: #a67c10;
            line-height: 1;
        }

        .icon-btn:hover { background: #f8f4e8; }

        .paste-area {
            padding: 1rem 1.5rem 0.5rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .paste-area textarea {
            width: 100%;
            border: 1px solid #c8dcc8;
            border-radius: 20px;
            padding: 12px 16px;
            font-size: 0.9rem;
            resize: vertical;
            min-height: 70px;
            background: #f8fbf8;
            color: #1e2e1e;
            outline: none;
            transition: 0.2s;
        }

        .paste-area textarea::placeholder { color: #9ab09a; }

        .paste-area textarea:focus {
            border-color: #1a6b3a;
            box-shadow: 0 0 0 3px rgba(26, 107, 58, 0.12);
            background: #ffffff;
        }

        .class-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .class-row select {
            flex: 2;
            min-width: 140px;
            border: 1px solid #c8dcc8;
            border-radius: 40px;
            padding: 10px 16px;
            font-size: 0.9rem;
            background: #f8fbf8;
            color: #1e2e1e;
            outline: none;
            cursor: pointer;
            font-weight: 500;
        }

        .class-row select:focus {
            border-color: #1a6b3a;
            box-shadow: 0 0 0 3px rgba(26, 107, 58, 0.12);
        }

        .btn {
            background: #1a6b3a;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 3px 10px rgba(26, 107, 58, 0.25);
            white-space: nowrap;
        }

        .btn:hover {
            background: #0f4b28;
            transform: scale(0.97);
            box-shadow: 0 5px 15px rgba(26, 107, 58, 0.35);
        }

        .btn-small { padding: 8px 14px; font-size: 0.8rem; }

        .btn:disabled {
            background: #a8c8a8;
            cursor: not-allowed;
            box-shadow: none;
        }

        .class-columns-container {
            display: flex;
            flex-direction: row;
            gap: 12px;
            padding: 0.8rem 1.5rem 1.5rem 1.5rem;
            overflow-x: auto;
            align-items: flex-start;
        }

        .class-column {
            flex: 1;
            min-width: 150px;
            background: #f8fbf8;
            border-radius: 20px;
            border: 1px solid #d8e8d8;
            padding: 12px 10px 10px 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .class-column-header {
            font-weight: 700;
            font-size: 1.1rem;
            color: #a67c10;
            text-align: center;
            padding-bottom: 6px;
            border-bottom: 2px solid #e8d9a8;
            letter-spacing: 1px;
        }

        .student-list-column {
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 60px;
            max-height: 420px;
            overflow-y: auto;
            padding-right: 2px;
        }

        .student-card-item {
            background: #ffffff;
            border-radius: 16px;
            padding: 10px 10px 8px 10px;
            border: 1px solid #d8e8d8;
            box-shadow: 0 2px 6px rgba(20, 80, 50, 0.04);
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: 0.2s;
        }

        .student-card-item:hover {
            border-color: #b8d4b8;
            box-shadow: 0 4px 12px rgba(20, 80, 50, 0.1);
        }

        .student-name-line {
            font-weight: 600;
            font-size: 0.88rem;
            color: #1e2e1e;
            word-break: break-word;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .student-name-line .student-name-text {
            flex: 1;
            padding: 2px 4px;
            border-radius: 8px;
            transition: 0.15s;
        }

        .student-name-line .student-name-text:hover {
            background: #f8f4e8;
            color: #a67c10;
        }

        .student-name-line .remove-student {
            font-size: 0.9rem;
            opacity: 0.6;
            background: transparent;
            border: none;
            color: #d9534f;
            cursor: pointer;
            padding: 0 4px;
            border-radius: 20px;
            transition: 0.15s;
        }

        .student-name-line .remove-student:hover {
            opacity: 1;
            background: #fdecea;
        }

        .points-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 3px;
            margin-top: 4px;
        }

        .point-box {
            background: #f0f5f0;
            border: 1px solid #c8dcc8;
            border-radius: 6px;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6rem;
            font-weight: 600;
            color: #4a6b4a;
            cursor: pointer;
            transition: 0.15s;
            user-select: none;
            padding: 0;
            line-height: 1;
        }

        .point-box:hover {
            background: #e0efe0;
            border-color: #a8c8a8;
            transform: scale(1.08);
        }

        .point-box:active { transform: scale(0.92); }

        .point-box.filled {
            background: #1a6b3a;
            border-color: #0f4b28;
            color: #ffffff;
            font-weight: 700;
            box-shadow: 0 0 6px rgba(26, 107, 58, 0.4);
        }

        .total-badge {
            font-size: 0.7rem;
            background: #f8f4e8;
            padding: 3px 6px;
            border-radius: 30px;
            text-align: center;
            font-weight: 600;
            color: #a67c10;
            margin-top: 2px;
            border: 1px solid #e8d9a8;
            letter-spacing: 0.5px;
        }

        .cert-btn {
            background: #f8f4e8;
            border: 1px solid #e8d9a8;
            border-radius: 30px;
            padding: 6px 10px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #a67c10;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            width: 100%;
            letter-spacing: 0.3px;
        }

        .cert-btn:hover { background: #f5edcf; border-color: #d4b84a; }
        .cert-btn:active { transform: scale(0.97); }

        .empty-message {
            text-align: center;
            color: #9ab09a;
            font-style: italic;
            padding: 0.8rem 0;
            font-size: 0.8rem;
        }

        .footer-note {
            margin-top: 3rem;
            text-align: center;
            font-size: 0.85rem;
            color: #7a9a7a;
            border-top: 1px solid #e0ebe0;
            padding-top: 1.5rem;
            letter-spacing: 0.3px;
            line-height: 1.8;
        }

        .no-results {
            text-align: center;
            padding: 3rem 1rem;
            color: #4a6b4a;
            font-size: 1.1rem;
            font-style: italic;
            background: #ffffff;
            border-radius: 32px;
            border: 1px dashed #c8dcc8;
        }

        .student-card-item.match-highlight {
            border: 2px solid #d4b84a;
            box-shadow: 0 0 0 3px rgba(212, 184, 74, 0.2);
        }

        .fullscreen-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #ffffff;
            background-image: 
                radial-gradient(circle at 10% 0%, rgba(26, 107, 58, 0.04) 0%, transparent 35%),
                radial-gradient(circle at 90% 100%, rgba(200, 150, 20, 0.05) 0%, transparent 35%);
            z-index: 9999;
            overflow-y: auto;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
        }

        .fullscreen-header {

            background: #1a6b3a;
            border: none;
            color: #ffffff;

            font-size: 0.9rem;

            justify-content: center;

            color: #4a6b4a;
            cursor: pointer;
            transition: 0.15s;
            user-select: none;
        }

        .fullscreen-point-box:hover {
            background: #e0efe0;
            border-color: #a8c8a8;
            transform: scale(1.05);
        }

        .fullscreen-point-box:active { transform: scale(0.95); }

        .fullscreen-point-box.filled {
            background: #1a6b3a;
            border-color: #0f4b28;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(26, 107, 58, 0.4);

        .fullscreen-total {
