<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CAMERA PARTOUT</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f4f7;
    color: #111;
}

header {
    background: linear-gradient(135deg, #07152f, #0757c9);
    color: white;
    padding: 22px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 30px;
}

header p {
    margin: 7px 0 0;
    opacity: .9;
}

.container {
    max-width: 900px;
    margin: 20px auto;
    padding: 15px;
}

.box {
    background: white;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

h2 {
    margin-top: 0;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 6px;
    font-weight: bold;
}

input,
select,
textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 16px;
}

textarea {
    min-height: 180px;
    resize: vertical;
}

.publish {
    width: 100%;
    margin-top: 20px;
    background: #e50914;
    color: white;
    border: none;
    padding: 14px;
    border-radius: 7px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.publish:hover {
    background: #b80710;
}

.publish:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.news-card {
    background: white;
    margin-bottom: 20px;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

.news-card img,
.news-card video {
    width: 100%;
    max-height: 500px;
    object-fit: cover;
    display: block;
}

.news-content {
    padding: 18px;
}

.category {
    display: inline-block;
    background: #0757c9;
    color: white;
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 13px;
}

.news-title {
    font-size: 24px;
    margin: 12px 0 8px;
}

.date {
    color: #777;
    font-size: 13px;
    margin-bottom: 12px;
}

.news-text {
    line-height: 1.6;
    white-space: pre-wrap;
}

.delete {
    background: #333;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 7px;
    cursor: pointer;
    margin-top: 10px;
}

.empty {
    text-align: center;
    color: #777;
    padding: 30px;
}

.status {
    margin-top: 15px;
    text-align: center;
    font-weight: bold;
}

footer {
    text-align: center;
    padding: 25px;
    color: #777;
}
</style>
</head>

<body>

<header>
    <h1>CAMERA PARTOUT</h1>
    <p>L'information partout, à tout moment.</p>
</header>

<div class="container">

    <!-- PUBLICATION -->
    <div class="box">

        <h2>Publier une nouvelle</h2>

        <label>Titre de la nouvelle</label>

        <input
            type="text"
            id="title"
            placeholder="Entrez le titre..."
        >

        <label>Catégorie</label>

        <select id="category">
            <option>Haïti</option>
            <option>International</option>
            <option>Sport</option>
            <option>Économie</option>
            <option>Culture</option>
            <option>Technologie</option>
            <option>Autre</option>
        </select>

        <label>Texte de la nouvelle</label>

        <textarea
            id="text"
            placeholder="Écrivez votre nouvelle ici..."
        ></textarea>

        <label>Ajouter une photo</label>

        <input
            type="file"
            id="image"
            accept="image/*"
        >

        <label>Ajouter une vidéo</label>

        <input
            type="file"
            id="video"
            accept="video/*"
        >

        <button
            class="publish"
            id="publishButton"
            onclick="publishNews()"
        >
            PUBLIER LA NOUVELLE
        </button>

        <div
            id="status"
            class="status"
        ></div>

    </div>


    <!-- ACTUALITÉS -->
    <div class="box">

        <h2>Dernières nouvelles</h2>

        <div id="newsList">

            <div class="empty">
                Chargement...
            </div>

        </div>

    </div>

</div>

<footer>
    © 2026 CAMERA PARTOUT
</footer>


<script>

/* =====================================================
   SUPABASE
   ===================================================== */

const SUPABASE_URL =
    "https://xhzhtwihrbjfqstxqffl.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_I15O020IqmK0cA5BkKWmbQ_TloEucFc";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* NOM DU BUCKET */

const BUCKET_NAME = "news-images";


/* =====================================================
   AFFICHER LES NOUVELLES
   ===================================================== */

async function displayNews() {

    const list =
        document.getElementById("newsList");

    list.innerHTML = `
        <div class="empty">
            Chargement...
        </div>
    `;

    const result =
        await supabaseClient
            .from("news")
            .select("*")
            .order("created_at", {
                ascending: false
            });

    const data = result.data;
    const error = result.error;


    if (error) {

        console.error(error);

        list.innerHTML = `
            <div class="empty">
                Erreur : ${escapeHTML(error.message)}
            </div>
        `;

        return;
    }


    if (!data || data.length === 0) {

        list.innerHTML = `
            <div class="empty">
                Aucune nouvelle publiée.
            </div>
        `;

        return;
    }


    list.innerHTML = "";


    data.forEach(item => {

        let media = "";


        /* PHOTO */

        if (item.image) {

            media += `
                <img
                    src="${escapeAttribute(item.image)}"
                    alt="Photo de la nouvelle"
                >
            `;
        }


        /* VIDEO */

        if (item.video) {

            media += `
                <video
                    controls
                    playsinline
                    preload="metadata"
                >
                    <source
                        src="${escapeAttribute(item.video)}"
                        type="video/mp4"
                    >

                    Votre navigateur ne supporte pas la vidéo.
                </video>
            `;
        }


        const date =
            item.created_at
            ? new Date(
                item.created_at
              ).toLocaleString("fr-FR")
            : "";


        const articleText =
            item.content || item.text || "";


        list.innerHTML += `

            <article class="news-card">

                ${media}

                <div class="news-content">

                    <span class="category">
                        ${escapeHTML(
                            item.category || ""
                        )}
                    </span>

                    <h3 class="news-title">
                        ${escapeHTML(
                            item.title || ""
                        )}
                    </h3>

                    <div class="date">
                        ${escapeHTML(date)}
                    </div>

                    <p class="news-text">
                        ${escapeHTML(articleText)}
                    </p>

                    <button
                        class="delete"
                        onclick="deleteNews('${item.id}')"
                    >
                        Supprimer
                    </button>

                </div>

            </article>
        `;
    });
}


/* =====================================================
   PUBLIER UNE NOUVELLE
   ===================================================== */

async function publishNews() {

    const title =
        document.getElementById("title")
        .value
        .trim();

    const category =
        document.getElementById("category")
        .value;

    const text =
        document.getElementById("text")
        .value
        .trim();

    const imageFile =
        document.getElementById("image")
        .files[0];

    const videoFile =
        document.getElementById("video")
        .files[0];

    const button =
        document.getElementById("publishButton");

    const status =
        document.getElementById("status");


    if (!title || !text) {

        alert(
            "Veuillez entrer un titre et le texte."
        );

        return;
    }


    button.disabled = true;

    button.textContent =
        "PUBLICATION...";

    status.textContent =
        "Préparation des fichiers...";


    try {

        let imageURL = null;
        let videoURL = null;


        /* =================================================
           UPLOAD PHOTO
           ================================================= */

        if (imageFile) {

            status.textContent =
                "Envoi de la photo...";


            imageURL =
                await uploadFile(imageFile);
        }


        /* =================================================
           UPLOAD VIDEO
           ================================================= */

        if (videoFile) {

            status.textContent =
                "Envoi de la vidéo...";


            videoURL =
                await uploadFile(videoFile);
        }


        /* =================================================
           ENREGISTRER LA NOUVELLE
           ================================================= */

        status.textContent =
            "Enregistrement de la nouvelle...";


        const result =
            await supabaseClient
                .from("news")
                .insert([
                    {
                        title: title,

                        category: category,

                        content: text,

                        image: imageURL,

                        video: videoURL
                    }
                ]);


        if (result.error) {

            throw result.error;
        }


        /* NETTOYER */

        document.getElementById("title")
            .value = "";

        document.getElementById("text")
            .value = "";

        document.getElementById("image")
            .value = "";

        document.getElementById("video")
            .value = "";


        status.textContent =
            "Publication réussie !";


        alert(
            "Nouvelle publiée avec succès !"
        );


        displayNews();


    } catch (error) {

        console.error(error);

        status.textContent =
            "Erreur de publication.";

        alert(
            "Erreur : " + error.message
        );


    } finally {

        button.disabled = false;

        button.textContent =
            "PUBLIER LA NOUVELLE";
    }
}


/* =====================================================
   ENVOYER UN FICHIER DANS SUPABASE STORAGE
   ===================================================== */

async function uploadFile(file) {

    /*
      Création d'un nom unique.
    */

    const extension =
        file.name
            .split(".")
            .pop()
            .toLowerCase();


    const fileName =
        Date.now()
        + "-"
        + Math.random()
            .toString(36)
            .substring(2)
        + "."
        + extension;


    const filePath =
        fileName;


    const result =
        await supabaseClient
            .storage
            .from(BUCKET_NAME)
            .upload(
                filePath,
                file,
                {
                    cacheControl: "3600",
                    upsert: false
                }
            );


    if (result.error) {

        throw result.error;
    }


    /*
      Obtenir l'URL publique.
    */

    const publicResult =
        supabaseClient
            .storage
            .from(BUCKET_NAME)
            .getPublicUrl(filePath);


    return publicResult.data.publicUrl;
}


/* =====================================================
   SUPPRIMER UNE NOUVELLE
   ===================================================== */

async function deleteNews(id) {

    if (
        !confirm(
            "Voulez-vous supprimer cette nouvelle ?"
        )
    ) {
        return;
    }


    const result =
        await supabaseClient
            .from("news")
            .delete()
            .eq("id", id);


    if (result.error) {

        alert(
            "Erreur : " +
            result.error.message
        );

        return;
    }


    displayNews();
}


/* =====================================================
   PROTECTION HTML
   ===================================================== */

function escapeHTML(value) {

    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");
}


function escapeAttribute(value) {

    return escapeHTML(value);
}


/* =====================================================
   DÉMARRAGE
   ===================================================== */

displayNews();

</script>

</body>
</html>
