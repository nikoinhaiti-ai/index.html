<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CAMERA PARTOUT</title>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f4f7;
    color: #111;
}

header {
    background: #07152f;
    color: white;
    padding: 18px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

header p {
    margin: 6px 0 0;
    opacity: .8;
}

.container {
    max-width: 900px;
    margin: 20px auto;
    padding: 15px;
}

.box {
    background: white;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

h2 {
    margin-top: 0;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 6px;
    font-weight: bold;
}

input,
select,
textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 16px;
}

textarea {
    min-height: 180px;
    resize: vertical;
}

button {
    border: none;
    padding: 13px 20px;
    border-radius: 7px;
    font-size: 16px;
    cursor: pointer;
}

.publish {
    width: 100%;
    margin-top: 20px;
    background: #e50914;
    color: white;
    font-weight: bold;
}

.publish:hover {
    background: #b80710;
}

.news-card {
    background: white;
    margin-bottom: 20px;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

.news-card img,
.news-card video {
    width: 100%;
    max-height: 450px;
    object-fit: cover;
    display: block;
}

.news-content {
    padding: 18px;
}

.category {
    display: inline-block;
    background: #0757c9;
    color: white;
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 13px;
}

.news-title {
    font-size: 24px;
    margin: 12px 0 8px;
}

.date {
    color: #777;
    font-size: 13px;
}

.news-text {
    line-height: 1.6;
    white-space: pre-wrap;
}

.delete {
    background: #333;
    color: white;
    margin-top: 10px;
}

.empty {
    text-align: center;
    color: #777;
    padding: 30px;
}

footer {
    text-align: center;
    padding: 25px;
    color: #777;
}
</style>
</head>

<body>

<header>
    <h1>CAMERA PARTOUT</h1>
    <p>Publiez vos nouvelles</p>
</header>

<div class="container">

    <!-- FORMULAIRE -->
    <div class="box">

        <h2>Publier une nouvelle</h2>

        <label>Titre de la nouvelle</label>

        <input
            type="text"
            id="title"
            placeholder="Entrez le titre..."
        >

        <label>Catégorie</label>

        <select id="category">
            <option>Haïti</option>
            <option>International</option>
            <option>Sport</option>
            <option>Économie</option>
            <option>Culture</option>
            <option>Technologie</option>
            <option>Autre</option>
        </select>

        <label>Texte de la nouvelle</label>

        <textarea
            id="text"
            placeholder="Écrivez votre nouvelle ici..."
        ></textarea>

        <label>Ajouter une photo</label>

        <input
            type="file"
            id="image"
            accept="image/*"
        >

        <label>Ajouter une vidéo</label>

        <input
            type="file"
            id="video"
            accept="video/*"
        >

        <button class="publish" onclick="publishNews()">
            PUBLIER LA NOUVELLE
        </button>

    </div>


    <!-- NOUVELLES -->
    <div class="box">

        <h2>Dernières nouvelles</h2>

        <div id="newsList">

            <div class="empty">
                Chargement...
            </div>

        </div>

    </div>

</div>

<footer>
    © 2026 CAMERA PARTOUT
</footer>


<script>

/* =====================================================
   SUPABASE
   ===================================================== */

const SUPABASE_URL =
    "https://xhzhtwihrbjfqstxqffl.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_I15O020IqmK0cA5BkKWmbQ_TloEucFc";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   CHARGER LES NOUVELLES DEPUIS SUPABASE
   ===================================================== */

async function displayNews() {

    const list =
        document.getElementById("newsList");

    list.innerHTML = `
        <div class="empty">
            Chargement...
        </div>
    `;

    const { data, error } =
        await supabaseClient
            .from("news")
            .select("*")
            .order("created_at", {
                ascending: false
            });


    if (error) {

        console.error(error);

        list.innerHTML = `
            <div class="empty">
                Erreur de connexion à Supabase.
                <br><br>
                ${error.message}
            </div>
        `;

        return;
    }


    if (!data || data.length === 0) {

        list.innerHTML = `
            <div class="empty">
                Aucune nouvelle publiée.
            </div>
        `;

        return;
    }


    list.innerHTML = "";


    data.forEach(item => {

        let media = "";


        if (item.image) {

            media += `
                <img
                    src="${item.image}"
                    alt="Image de la nouvelle"
                >
            `;
        }


        if (item.video) {

            media += `
                <video controls>
                    <source src="${item.video}">
                    Votre navigateur ne supporte pas la vidéo.
                </video>
            `;
        }


        const date =
            item.created_at
                ? new Date(
                    item.created_at
                  ).toLocaleString("fr-FR")
                : "";


        list.innerHTML += `

            <article class="news-card">

                ${media}

                <div class="news-content">

                    <span class="category">
                        ${escapeHTML(item.category || "")}
                    </span>

                    <h3 class="news-title">
                        ${escapeHTML(item.title || "")}
                    </h3>

                    <div class="date">
                        ${date}
                    </div>

                    <p class="news-text">
                        ${escapeHTML(item.text || item.content || "")}
                    </p>

                    <button
                        class="delete"
                        onclick="deleteNews('${item.id}')">
                        Supprimer
                    </button>

                </div>

            </article>
        `;
    });
}


/* =====================================================
   PUBLIER
   ===================================================== */

async function publishNews() {

    const title =
        document.getElementById("title")
        .value
        .trim();

    const category =
        document.getElementById("category")
        .value;

    const text =
        document.getElementById("text")
        .value
        .trim();

    const imageFile =
        document.getElementById("image")
        .files[0];

    const videoFile =
        document.getElementById("video")
        .files[0];


    if (!title || !text) {

        alert(
            "Veuillez entrer un titre et le texte de la nouvelle."
        );

        return;
    }


    const button =
        document.querySelector(".publish");

    button.disabled = true;

    button.textContent =
        "PUBLICATION...";


    try {

        let imageData = null;
        let videoData = null;


        /* PHOTO */

        if (imageFile) {

            imageData =
                await fileToDataURL(imageFile);
        }


        /* VIDEO */

        if (videoFile) {

            videoData =
                await fileToDataURL(videoFile);
        }


        /* ENREGISTRER DANS SUPABASE */

        const { error } =
            await supabaseClient
                .from("news")
                .insert([
                    {
                        title: title,
                        category: category,
                        text: text,
                        image: imageData,
                        video: videoData
                    }
                ]);


        if (error) {

            throw error;
        }


        /* NETTOYER */

        document.getElementById("title")
            .value = "";

        document.getElementById("text")
            .value = "";

        document.getElementById("image")
            .value = "";

        document.getElementById("video")
            .value = "";


        alert(
            "Nouvelle publiée avec succès !"
        );


        displayNews();


    } catch (error) {

        console.error(error);

        alert(
            "Erreur : " + error.message
        );


    } finally {

        button.disabled = false;

        button.textContent =
            "PUBLIER LA NOUVELLE";
    }
}


/* =====================================================
   CONVERTIR FICHIER EN DATA URL
   ===================================================== */

function fileToDataURL(file) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();

            reader.onload =
                () => resolve(
                    reader.result
                );

            reader.onerror =
                reject;

            reader.readAsDataURL(file);
        }
    );
}


/* =====================================================
   SUPPRIMER UNE NOUVELLE
   ===================================================== */

async function deleteNews(id) {

    if (
        !confirm(
            "Voulez-vous supprimer cette nouvelle ?"
        )
    ) {
        return;
    }


    const { error } =
        await supabaseClient
            .from("news")
            .delete()
            .eq("id", id);


    if (error) {

        alert(
            "Erreur : " + error.message
        );

        return;
    }


    displayNews();
}


/* =====================================================
   PROTECTION DU HTML
   ===================================================== */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =====================================================
   DÉMARRAGE
   ===================================================== */

displayNews();

</script>

</body>
</html>
